services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ficdev_recomendacao}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/criar_banco.sql:/docker-entrypoint-initdb.d/criar_banco.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ficdev_recomendacao}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - backend


volumes:
  postgres_data:
  mongo_data:


networks:
  backend:
    driver: bridge